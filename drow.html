<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; 
        }
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="controls">
    <input type="color" id="color" >
    <button onclick="drow()">Drow</button>
    </div>    
    <canvas id="can"></canvas>
    <script>
        canvas = document.getElementById("can");
        ctx = canvas.getContext("2d");
        color = document.getElementById("color");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        function drow(){
            ctx.beginPath();
            ctx.strokeStyle = color.value
            ctx.lineWidth = 2;
            ctx.arc(Math.random()*canvas.width,Math.random()*canvas.height,20,0,2*Math.PI,true);
            ctx.stroke()
        }
    </script>
</body>
</html>
